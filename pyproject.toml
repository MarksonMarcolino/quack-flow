[project]
name = "quack-flow"
version = "0.1.0"
description = "Zero-cost pipeline that correlates GitHub developer activity with tech stock movements and explains the signal in plain English."
requires-python = ">=3.11,<3.12"
dependencies = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "duckdb>=1.2",
    "mlflow>=2.12",
    "pandas>=2.0",
    "polars>=0.20",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "scipy>=1.13",
    "sentence-transformers>=3.0",
    "shap>=0.45",
    "statsmodels>=0.14",
    "streamlit>=1.35",
    "xgboost>=2.0",
    "yfinance>=0.2",
]

[tool.uv]

[dependency-groups]
airflow = [
    "apache-airflow>=2.10,<2.11",
]
# Pinned to 3.11: Airflow 2.10 and most ML libs are not yet tested on 3.12+.
# Bump only when the whole stack is proven on the new version.
