# quack-flow local orchestration stack.
#
# Airflow runs in Docker; Ollama stays on the host (per CLAUDE.md — llama3
# pulled via `ollama pull llama3`, accessed from Airflow containers via
# host.docker.internal:11434).
#
# Bring up:   docker-compose up -d
# Bring down: docker-compose down
#
# The launchd trigger in scripts/launchd_trigger.sh wraps this loop so the
# stack only lives while a scheduled run is actually executing.

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.4-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Host-accessible Ollama. docker-compose on Mac + Linux both resolve
    # host.docker.internal to the host machine.
    OLLAMA_HOST: http://host.docker.internal:11434
    # Pass through the credentials the DAG tasks need. Values come from the
    # shell environment when `docker-compose up` is invoked — define them in
    # .env or export them before running launchd_trigger.sh.
    MOTHERDUCK_TOKEN: ${MOTHERDUCK_TOKEN:-}
    ENV: ${ENV:-dev}
    MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-./mlruns}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dbt_project:/opt/airflow/dbt_project
    - ./ml:/opt/airflow/ml
    - ./analysis:/opt/airflow/analysis
    - ./mlruns:/opt/airflow/mlruns
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username airflow --password airflow \
          --firstname Admin --lastname User \
          --role Admin --email admin@quack-flow.local || true

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
